name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Run workspace checks
        run: bunx turbo run check --filter=!typed-xlsx-benchmark

      - name: Verify docs Twoslash
        run: bunx turbo run twoslash:verify --filter=typed-xlsx-docs

  package:
    name: package (node ${{ matrix.node }}, typescript ${{ matrix.typescript }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        # 5.7 is the oldest TypeScript that reads the bundled declarations (Uint8Array is generic).
        typescript: ["5.7", latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      # The workspace's dev dependencies (the docs app's native modules) need a current Node to
      # install, so install and build on Node 24, then switch to the Node version under test.
      - name: Setup Node 24 for install and build
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the package
        run: bunx turbo run build --filter=typed-xlsx

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test the packed package (Node ${{ matrix.node }}, TypeScript ${{ matrix.typescript }})
        run: node packages/core/scripts/smoke-packed.mjs ${{ matrix.typescript }}

      - name: Test the packed package on Bun
        if: matrix.node == 24 && matrix.typescript == 'latest'
        run: node packages/core/scripts/smoke-packed.mjs latest --runtime=bun

      - name: Setup Deno
        if: matrix.node == 24 && matrix.typescript == 'latest'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test the packed package on Deno
        if: matrix.node == 24 && matrix.typescript == 'latest'
        run: node packages/core/scripts/smoke-packed.mjs latest --runtime=deno
